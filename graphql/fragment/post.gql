fragment PostOverview on Post {
  id
  title
  publishedDate
  apiDataBrief
  apiData
  heroImage {
    ...ImageData
  }
  og_image {
    ...ImageData
  }
}

fragment PostItem on Post {
  id
  title
  heroImage {
    ...ImageData
  }
}

fragment TopicPost on Post {
  id
  title
  apiDataBrief
  apiData
  heroImage {
    ...ImageData
  }
  og_image {
    ...ImageData
  }
}

fragment RelatedPost on Post {
  id
  title
  heroImage {
    ...ImageData
  }
  og_image {
    ...ImageData
  }
  sections {
    name
    color
  }
}

fragment PostDetail on Post {
  id
  title
  subtitle
  heroCaption
  publishedDate
  updatedAt
  hiddenAdvertised
  heroImage {
    ...ImageData
  }
  og_image {
    ...ImageData
  }
  tags {
    slug
    name
  }
  tags_algo {
    slug
    name
  }
  sections {
    name
    color
    slug
  }
  categories {
    name
    slug
  }
  writers {
    id
    name
  }
  photographers {
    id
    name
  }
  designers {
    id
    name
  }
  engineers {
    id
    name
  }
  apiData
  apiDataBrief
  Warning {
    id
    content
  }
  Warnings {
    id
    content
  }
  isAdult
}
