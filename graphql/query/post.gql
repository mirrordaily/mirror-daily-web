  postsCount(
    where: {
      state: { equals: "published" }
      OR: [
        { tags: { some: { slug: { equals: $slug } } } }
        { tags_algo: { some: { slug: { equals: $slug } } } }
      ]
    }
  ) @include(if: $withAmount)
}

query GetPostById($id: ID!) {
  post(where: { id: $id }) {
    ...PostDetail
  }
}

query GetPostsBySameSection(
  $take: Int!
  $slug: String
  $publishedDate: DateTime
) {
  posts(
    take: $take
    where: {
      state: { equals: "published" }
      sections: { some: { slug: { equals: $slug } } }
      publishedDate: { lt: $publishedDate }
    }
    orderBy: [{ createdAt: desc }]
  ) {
    ...PostDetail
  }
}

query GetRelatedPostsById($id: ID!) {
  post(where: { id: $id }) {
    relatedsOne {
      ...RelatedPost
    }
    relatedsTwo {
      ...RelatedPost
    }
    relatedsThree {
      ...RelatedPost
    }
    relateds {
      ...RelatedPost
    }
  }
}
