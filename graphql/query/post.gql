query GetPostsBySectionSlug(
  $skip: Int!
  $take: Int
  $slug: String!
  $withAmount: Boolean! = false
) {
  posts(
    skip: $skip
    take: $take
    where: {
      state: { equals: "published" }
      sections: { some: { slug: { equals: $slug } } }
    }
    orderBy: [{ publishedDate: desc }]
  ) {
    ...PostOverview
  }
  postsCount(
    where: {
      state: { equals: "published" }
      sections: { some: { slug: { equals: $slug } } }
    }
  ) @include(if: $withAmount)
}

